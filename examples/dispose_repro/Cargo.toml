[package]
name = "dispose-repro"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8", optional = true }
console_error_panic_hook = "0.1"
leptos = { version = "=0.8.22" }
leptos_axum = { version = "=0.8.10", optional = true }
leptos_meta = { version = "=0.8.7" }
leptos_router = { version = "=0.8.17" }
# Not used directly. Listed to pin the versions the panics were found on.
reactive_graph = "=0.2.15"
server_fn = "=0.8.13"
tachys = "=0.2.19"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"], optional = true }
wasm-bindgen = "=0.2.129"

[features]
hydrate = ["leptos/hydrate"]
ssr = ["dep:axum", "dep:tokio", "dep:leptos_axum", "leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr"]

[profile.release]
panic = "abort"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

[package.metadata.leptos]
output-name = "dispose-repro"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
